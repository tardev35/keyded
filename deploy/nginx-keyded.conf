# วางที่ /etc/nginx/sites-available/keyded แล้ว symlink เข้า sites-enabled
# ห้ามแก้ไฟล์ของอีก 324 เว็บบนเครื่องนี้ เพิ่มไฟล์นี้ไฟล์เดียว
#
# TLS จบที่ Cloudflare (โดเมนชี้ไป 104.21.38.65 / 172.67.219.183 แล้ว)
# เครื่องนี้จึงฟังแค่พอร์ต 80 เหมือนอีก 324 เว็บ ไม่ต้องใช้ certbot

# เมื่อมี Cloudflare คั่น $remote_addr จะกลายเป็น IP ของ Cloudflare ทุกคน
# ถ้าไม่แปลงกลับ ระบบจำกัดคำขอรายไอพีของเราจะมองคนทั้งโลกเป็นคนเดียว
# ช่วง IP ดึงจาก cloudflare.com/ips-v4 เมื่อ 5 ก.ย. 2569 · เขาเพิ่มช่วงใหม่เป็นระยะ
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name keyded.yoalink.com;

    root /var/www/keyded/dist;
    index index.html;

    client_max_body_size 256k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    # ไฟล์ที่ Vite ตั้งชื่อติด hash แคชได้ยาว เพราะชื่อเปลี่ยนทุกครั้งที่ build
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ห้ามแคชเด็ดขาด ไม่งั้น Cloudflare จะจำของเก่าไว้หลายชั่วโมง
    # แล้วผู้ใช้ยังเห็นเวอร์ชันเดิมทั้งที่ deploy ไปแล้ว (บทเรียนใน CLAUDE.md)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # ค้นคำกว้างใช้เวลาได้ถึง 45 วินาที (วัดจริง 4 ก.ย. 2569)
        # ค่าเริ่มต้น 60 วินาทีของ nginx จะตัดก่อนที่ DataForSEO จะตอบ
        # หมายเหตุ Cloudflare แผนฟรี/Pro ตัดที่ 100 วินาที เป็นเพดานจริงอีกชั้น
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;

        # ผลการค้นหาเป็นของเฉพาะผู้ใช้แต่ละคน ห้ามให้ Cloudflare แคชเด็ดขาด
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/keyded.access.log;
    error_log  /var/log/nginx/keyded.error.log;
}

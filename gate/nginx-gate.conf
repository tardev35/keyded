# วางที่ /etc/nginx/sites-available/gate แล้ว symlink เข้า sites-enabled
# ห้ามแก้ไฟล์ของอีก 325 เว็บบนเครื่องนี้ เพิ่มไฟล์นี้ไฟล์เดียว
#
# TLS จบที่ Cloudflare เหมือน keyded เครื่องนี้จึงฟังแค่พอร์ต 80 ไม่ต้องใช้ certbot
#
# หน้านี้เป็น HTML ไฟล์เดียว ไม่มี API ไม่มีฐานข้อมูล ไม่มี asset ติด hash
# จึงไม่ต้องมี set_real_ip_from เหมือน keyded เพราะไม่มีอะไรจำกัดรายไอพี

server {
    listen 80;
    server_name gate.yoalink.com;

    root /var/www/gate;
    index index.html;

    client_max_body_size 16k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/html text/css image/svg+xml;

    # ไฟล์เดียวและแก้ทับที่เดิมเสมอ ถ้าปล่อยให้แคชจะแก้ลิงก์แล้วคนไม่เห็นของใหม่
    # (บทเรียนเดียวกับ index.html ของ keyded)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/gate.access.log;
    error_log  /var/log/nginx/gate.error.log;
}

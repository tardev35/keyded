stages:
  - build
  - deploy

variables:
  NODE_VERSION: "22"

# build บน runner ไม่ใช่บนเซิร์ฟเวอร์ — เครื่องปลายทางมี RAM 1.9 GB
# และรันเว็บอื่นอยู่ 324 ตัว การ build ที่นั่นจะไปแย่ง RAM ของเว็บที่ขายอยู่
build-frontend:
  stage: build
  image: node:22-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs: [build-frontend]
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    # หน้าเว็บ — ส่งขึ้นโฟลเดอร์ชั่วคราวก่อนแล้วค่อยสลับ ผู้ใช้จะได้ไม่เจอหน้าครึ่งๆ ระหว่างคัดลอก
    - rsync -az --delete frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:/var/www/keyded/dist.new/"
    # หลังบ้าน — ไม่ส่ง node_modules ให้เครื่องปลายทางลงเองด้วย npm ci
    - rsync -az --delete --exclude node_modules backend/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/keyded/backend/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" < deploy/release.sh
  environment:
    name: production
    url: https://$DEPLOY_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: false
